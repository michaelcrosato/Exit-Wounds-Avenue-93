<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perspective Lab · my-3D2dge</title>
<!--
  Built with the my-3D2dge engine: https://github.com/michaelcrosato/my-3d2dge
  This file is standalone: engine + game are inlined below. To hand it to another AI,
  point it at the "READ THIS FIRST" block at the top of the engine script.
-->
<style>
:root{
  --bg:#f0e6d6; --panel:rgba(250,242,228,.92); --ink:#2a2140; --muted:#63557a; --accent:#b8612a; --accent-ink:#fff6e6;
  --line:rgba(42,33,64,.2); --key:rgba(42,33,64,.1); --hp:#c8452f; --hp-bg:rgba(42,33,64,.18);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#06050b; --panel:rgba(18,14,30,.82); --ink:#f1e4c8; --muted:#ab9dc0; --accent:#f0a23a; --accent-ink:#1c1428; --line:rgba(241,228,200,.16); --key:rgba(241,228,200,.12); --hp:#e0463c; --hp-bg:rgba(241,228,200,.12); }
}
:root[data-theme="dark"]{ --bg:#06050b; --panel:rgba(18,14,30,.82); --ink:#f1e4c8; --muted:#ab9dc0; --accent:#f0a23a; --accent-ink:#1c1428; --line:rgba(241,228,200,.16); --key:rgba(241,228,200,.12); --hp:#e0463c; --hp-bg:rgba(241,228,200,.12); }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Pixelify Sans','Trebuchet MS',system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none}
#screen{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;cursor:crosshair}
.hud{position:absolute;z-index:2;pointer-events:none}
.hud > *{pointer-events:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.top{top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:space-between}
.brand{padding:9px 13px 10px;max-width:min(400px,100%)}
.brand h1{margin:0;font-size:21px;font-weight:600;line-height:1.1}
.brand p{margin:5px 0 0;font-size:13.5px;line-height:1.4;color:var(--muted)}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.seg{display:flex;gap:3px;padding:3px;align-items:center}
button{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:0;border-radius:4px;padding:6px 10px;min-height:34px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
button:hover{background:var(--key)}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
kbd{font:inherit;font-size:11px;line-height:1;padding:3px 5px;border-radius:3px;background:var(--key);min-width:18px;text-align:center}
button[aria-pressed="true"] kbd{background:rgba(0,0,0,.16)}
.fps{font-size:12px;color:var(--muted);padding:0 6px;min-width:50px;text-align:right}
.bottom{left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.vitals{padding:9px 12px;min-width:220px}
.hpbar{height:10px;border-radius:2px;background:var(--hp-bg);overflow:hidden;margin:6px 0 5px}
#hpFill{height:100%;width:100%;background:var(--hp);transition:width .12s}
.row{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.row b{color:var(--ink);font-weight:600}
.keys{margin:0;padding:7px 11px;font-size:13px;line-height:1.45;color:var(--muted);max-width:52ch}
.keys b{color:var(--ink);font-weight:600}
#banner{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);z-index:2;text-align:center;pointer-events:none;opacity:0;transition:opacity .35s;color:#f6e7c6;text-shadow:0 2px 0 #1a0f1c,0 0 18px rgba(0,0,0,.6)}
#banner.show{opacity:1}
#bannerTitle{font-size:clamp(28px,5vw,46px);font-weight:600;line-height:1}
#bannerSub{font-size:16px;margin-top:6px;color:#d9c7a6}
.touch{display:none;right:14px;bottom:86px;gap:10px;align-items:flex-end}
.touch button{width:62px;height:62px;justify-content:center;border-radius:50%;background:var(--panel);border:1px solid var(--line)}
.touch button.on{background:var(--accent);color:var(--accent-ink)}
@media (pointer:coarse){ .touch{display:flex} .keys{display:none} kbd{display:none} }
@media (max-width:720px),(max-height:520px){ .brand p{display:none} .brand h1{font-size:17px} .top{top:8px;left:8px;right:8px} }
@media (prefers-reduced-motion: reduce){ #banner,#hpFill{transition:none} }
a.to-labs{font-size:13px;font-weight:400;margin-left:8px;color:var(--accent);text-decoration:none;white-space:nowrap}a.to-labs:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="screen" role="img" aria-label="Perspective lab: one room rendered from five camera views"></canvas>
  <div class="hud top">
    <div class="brand panel">
      <h1>Perspective Lab <a class="to-labs" href="labs.html" title="Every lab and test page">All labs</a></h1>
      <p id="note"></p>
    </div>
    <div class="controls">
      <div class="seg panel" role="group" aria-label="Camera view">
        <button type="button" data-view="iso" aria-pressed="false"><kbd>1</kbd>Isometric</button>
        <button type="button" data-view="threequarter" aria-pressed="false"><kbd>2</kbd>Three-quarter</button>
        <button type="button" data-view="topdown" aria-pressed="false"><kbd>3</kbd>Top-down</button>
        <button type="button" data-view="brawler" aria-pressed="false"><kbd>4</kbd>Brawler</button>
        <button type="button" data-view="side" aria-pressed="false"><kbd>5</kbd>Side</button>
      </div>
      <div class="seg panel" role="group" aria-label="Inspection tools">
        <button type="button" id="rigBtn" aria-pressed="false"><kbd>R</kbd>Skeleton</button>
        <button type="button" id="lightBtn" aria-pressed="false"><kbd>L</kbd>Lighting</button>
        <button type="button" id="slowBtn" aria-pressed="false"><kbd>T</kbd>Slow motion</button>
        <span class="fps" id="fps">60 fps</span>
      </div>
    </div>
  </div>
  
  <div class="hud bottom">
    <p class="keys panel"><b>WASD</b> moves, <b>J</b> slashes, <b>Space</b> dashes. <b>V</b> cycles all five cameras. The same skeleton drives every view: press <b>R</b> to see it.</p>
  </div>
  <div class="hud touch" aria-hidden="true">
    <button data-act="dash">Dash</button><button data-act="attack">Slash</button>
  </div>
</div>
<!-- @inline engine/my-3d2dge.js -->
<!-- @inline src/lab.game.js -->
</body>
</html>
