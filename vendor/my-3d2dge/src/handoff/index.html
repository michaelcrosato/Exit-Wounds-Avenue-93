<head>

<style>
  :root { color-scheme: light dark; --ink: #1b1726; --paper: #f6f3ee; --line: #d8d2c8; --accent: #6a4ad0 }
  @media (prefers-color-scheme: dark) { :root { --ink: #ece8f6; --paper: #15121c; --line: #3a3348; --accent: #a68cff } }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 system-ui, sans-serif }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem } p { margin: .5rem 0 1rem }
  ul { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--line) }
  li { padding: .6rem 0; border-bottom: 1px solid var(--line) } a { color: var(--accent); font-family: ui-monospace, Menlo, monospace }
  li span { display: block; font-size: .9rem; opacity: .8 }
</style>
</head>
